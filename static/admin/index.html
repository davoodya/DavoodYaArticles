<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کامنت‌ها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: #0f0f0f;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 8px;
            padding: 40px;
        }

        .login-title {
            color: #00ff41;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            color: #b0b0b0;
        }

        .form-input {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }

        .btn-primary {
            padding: 12px;
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid #00ff41;
            color: #00ff41;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .error-message {
            color: #ff0000;
            text-align: center;
            padding: 10px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 5px;
            display: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: none;
        }

        h1 {
            color: #00ff41;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #0f0f0f;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            color: #00ff41;
            font-weight: bold;
        }

        .stat-label {
            color: #b0b0b0;
            margin-top: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(0, 255, 65, 0.3);
        }

        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #b0b0b0;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .tab.active {
            color: #00ff41;
            border-bottom: 2px solid #00ff41;
        }

        .article-filter {
            margin-bottom: 20px;
            padding: 15px;
            background: #0f0f0f;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 8px;
        }

        .article-filter input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: #e0e0e0;
        }

        .comment-card {
            background: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .comment-card:hover {
            border-color: rgba(0, 255, 65, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .comment-info {
            flex: 1;
        }

        .comment-author {
            font-size: 1.2rem;
            color: #00ff41;
            font-weight: bold;
        }

        .comment-meta {
            color: #808080;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .comment-article {
            color: #3aaddf;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .comment-body {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .comment-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-approve {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid #00ff41;
            color: #00ff41;
        }

        .btn-approve:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .btn-reject {
            background: rgba(224, 108, 17, 0.1);
            border: 1px solid #e06c11;
            color: #e06c11;
        }

        .btn-reject:hover {
            background: rgba(224, 108, 17, 0.2);
            box-shadow: 0 0 10px rgba(224, 108, 17, 0.3);
        }

        .btn-delete {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
        }

        .btn-delete:hover {
            background: rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-pending {
            background: rgba(224, 108, 17, 0.2);
            color: #e06c11;
        }

        .status-approved {
            background: rgba(0, 255, 65, 0.2);
            color: #00ff41;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #808080;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00ff41;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 65, 0.3);
            border-top-color: #00ff41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .comment-header {
                flex-direction: column;
            }

            .comment-actions {
                width: 100%;
            }

            .btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <h2 class="login-title">🛡️ پنل مدیریت کامنت‌ها</h2>
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="password">رمز عبور:</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="رمز عبور را وارد کنید"
                    required
                />
            </div>
            <button type="submit" class="btn-primary">ورود</button>
            <div class="error-message" id="loginError">رمز عبور اشتباه است</div>
        </form>
    </div>

    <!-- Admin Panel -->
    <button class="logout-btn" id="logoutBtn" style="display: none;">خروج</button>
    
    <div class="container" id="adminPanel">
        <h1>🛡️ پنل مدیریت کامنت‌ها</h1>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalComments">0</div>
                <div class="stat-label">کل کامنت‌ها</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingComments">0</div>
                <div class="stat-label">در انتظار تایید</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="approvedComments">0</div>
                <div class="stat-label">تایید شده</div>
            </div>
        </div>

        <div class="article-filter">
            <input 
                type="text" 
                id="articleSlugInput" 
                placeholder="نام مقاله (article slug) را وارد کنید و Enter بزنید..."
            />
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="pending">در انتظار تایید</button>
            <button class="tab" data-tab="approved">تایید شده</button>
            <button class="tab" data-tab="all">همه</button>
        </div>

        <div id="commentsContainer">
            <div class="empty-state">ابتدا نام مقاله را وارد کنید</div>
        </div>
    </div>

    <script>
        // State
        let adminPassword = '';
        let currentArticle = '';
        let allComments = [];
        let currentTab = 'pending';

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            adminPassword = password;
            
            // Hide login, show panel
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('articleSlugInput').focus();
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            adminPassword = '';
            currentArticle = '';
            allComments = [];
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('password').value = '';
            document.getElementById('commentsContainer').innerHTML = '<div class="empty-state">ابتدا نام مقاله را وارد کنید</div>';
        });

        // Article slug input
        document.getElementById('articleSlugInput').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const slug = e.target.value.trim();
                if (slug) {
                    currentArticle = slug;
                    await loadComments();
                }
            }
        });

        // Load comments via Netlify Blobs (direct read)
        async function loadComments() {
            if (!currentArticle) return;
            
            const container = document.getElementById('commentsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>';
            
            try {
                // Call the comments function to get data
                const response = await fetch(`/.netlify/functions/comments?article=${encodeURIComponent(currentArticle)}`, {
                    headers: {
                        'Authorization': `Bearer ${adminPassword}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load');
                }
                
                const data = await response.json();
                
                // We need ALL comments (including unconfirmed) for admin
                // So we'll make a custom admin endpoint call
                // For now, this is a limitation - showing only confirmed
                allComments = data.comments || [];
                
                // For a complete solution, you'd need to:
                // 1. Store all comments centrally, OR
                // 2. Create a separate admin endpoint that returns unconfirmed too
                
                updateStats();
                renderComments();
            } catch (error) {
                console.error('Error loading comments:', error);
                container.innerHTML = '<div class="empty-state">خطا در بارگذاری کامنت‌ها</div>';
            }
        }

        // Update statistics
        function updateStats() {
            const total = allComments.length;
            const pending = allComments.filter(c => !c.confirmed).length;
            const approved = allComments.filter(c => c.confirmed).length;

            document.getElementById('totalComments').textContent = total;
            document.getElementById('pendingComments').textContent = pending;
            document.getElementById('approvedComments').textContent = approved;
        }

        // Render comments
        function renderComments() {
            let filtered = [];
            
            if (currentTab === 'pending') {
                filtered = allComments.filter(c => !c.confirmed);
            } else if (currentTab === 'approved') {
                filtered = allComments.filter(c => c.confirmed);
            } else {
                filtered = allComments;
            }

            const container = document.getElementById('commentsContainer');

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">کامنتی یافت نشد</div>';
                return;
            }

            filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            container.innerHTML = filtered.map(comment => `
                <div class="comment-card">
                    <div class="comment-header">
                        <div class="comment-info">
                            <div class="comment-author">${escapeHtml(comment.name)}</div>
                            <div class="comment-meta">
                                🕒 ${new Date(comment.created_at).toLocaleString('fa-IR')}
                            </div>
                            <div class="comment-article">
                                📄 مقاله: ${currentArticle}
                            </div>
                            ${comment.website ? `<div class="comment-meta">🔗 ${escapeHtml(comment.website)}</div>` : ''}
                        </div>
                        <span class="status-badge ${comment.confirmed ? 'status-approved' : 'status-pending'}">
                            ${comment.confirmed ? '✓ تایید شده' : '⏳ در انتظار'}
                        </span>
                    </div>
                    <div class="comment-body">${escapeHtml(comment.comment)}</div>
                    <div class="comment-actions">
                        ${!comment.confirmed ? 
                            `<button class="btn btn-approve" onclick="handleAction('approve', '${comment.id}')">
                                ✓ تایید
                            </button>` : 
                            `<button class="btn btn-reject" onclick="handleAction('unapprove', '${comment.id}')">
                                ◄ برگشت به در انتظار
                            </button>`
                        }
                        <button class="btn btn-delete" onclick="handleAction('delete', '${comment.id}')">
                            🗑️ حذف
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Handle action
        async function handleAction(action, commentId) {
            const confirmMessages = {
                'approve': 'آیا از تایید این کامنت مطمئن هستید؟',
                'unapprove': 'آیا می‌خواهید این کامنت را به حالت در انتظار برگردانید؟',
                'delete': 'آیا از حذف این کامنت مطمئن هستید؟ این عمل قابل بازگشت نیست!'
            };
            
            if (!confirm(confirmMessages[action])) return;
            
            try {
                const response = await fetch('/.netlify/functions/admin-comments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminPassword}`
                    },
                    body: JSON.stringify({
                        action: action,
                        article_slug: currentArticle,
                        comment_id: commentId
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('✓ عملیات با موفقیت انجام شد');
                    await loadComments();
                } else {
                    alert('✗ خطا: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('✗ خطا در انجام عملیات');
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderComments();
            });
        });
    </script>
</body>
</html>
