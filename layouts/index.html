{{ define "main" }}

<div class="container">
  <h1 class="page-title">دسته‌بندی‌ها</h1>

  <div class="home-grid">
    {{ range .Site.Sections }}
    <div class="category-card">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ if .Params.description }}
      <p>{{ .Params.description }}</p>
      {{ end }}
      <p><strong>{{ len .Pages }}</strong> مطلب</p>
    </div>
    {{ end }}
  </div>
</div>

{{ end }}
