<!-- Header - Based on Main Website -->

<header>
    <div class="container">
        <nav>
            <!-- Logo -->
            <div class="logo">
                <h2>DAVOOD<span>_</span>YAHAY</h2>
            </div>

            <!-- Navigation Links -->
            <ul class="nav-links font-title">
                <li><a href="https://davoodya.ir/" title="صفحه اصلی وبسایت داوود یاحی davoodya.ir">خانه</a></li>
                <li><a href="https://davoodya.ir/#about" title="صفحه درباره من وبسایت داوود یاحی davoodya.ir">درباره من</a></li>
                <li><a href="https://davoodya.ir/#services" title="صفحه خدمات وبسایت داوود یاحی davoodya.ir">سرویس ها</a></li>
                <li><a href="https://davoodya.ir/#portfolio" title="صفحه نمونه کار ها وبسایت داوود یاحی davoodya.ir">نمونه ابزارها</a></li>
                <li><a href="https://davoodya.ir/pages/courses.html" title="صفحه دوره ها وبسایت داوود یاحی davoodya.ir">دوره‌های آموزشی</a></li>
                <li><a href="{{ .Site.BaseURL }}" class="{{ if .IsHome }}active{{ end }}" title="صفحه مقالات وبسایت داوود یاحی davoodya.ir">مقالات</a></li>
                <li><a href="https://davoodya.ir/pages/skills.html" title="صفحه مهارت ها وبسایت داوود یاحی davoodya.ir">مهارت‌ها و مدارک</a></li>
                <li><a href="https://davoodya.ir/#contact" title="صفحه تماس با من وبسایت داوود یاحی davoodya.ir">تماس با من</a></li>
            </ul>
            
            <!-- Search Button -->
            {{ partial "search.html" (dict "inline" false) }}

            <!-- Mobile Menu Toggle -->
            <div class="hamburger">
                <svg class="fa-icon" aria-hidden="true" width="24" height="24" viewBox="0 0 448 512">
                    <path fill="currentColor" d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z"/>
                </svg>
            </div>
        </nav>
    </div>
</header>

<script>
// Mobile Menu Toggle
document.addEventListener('DOMContentLoaded', function() {
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');
    
    if (hamburger && navLinks) {
        hamburger.addEventListener('click', function() {
            navLinks.classList.toggle('active');
            hamburger.classList.toggle('active');
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('nav')) {
                navLinks.classList.remove('active');
                hamburger.classList.remove('active');
            }
        });
    }
});
</script>
