{{ define "main" }}

<div class="container">
    <div class="main-content-wrapper">
        {{ partial "sidebar.html" . }}
        
        <article class="article-wrapper{{ if .Params.custom_class }} {{ .Params.custom_class }}{{ end }}">
            <h1 class="article-title">{{ .Title }}</h1>
            <div class="article-content{{ if .Params.custom_class }} {{ .Params.custom_class }}-content{{ end }}">
                {{ .Content }}
            </div>
        </article>
    </div>
</div>

{{ end }}
