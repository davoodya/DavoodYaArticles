<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بارگذاری... | {{ .Site.Title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Vazir', 'Shabnam', sans-serif;
            background: #0a0a0a;
            color: #00ff41;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .loading-container {
            text-align: center;
            padding: 2rem;
        }
        
        .loading-icon {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(0, 255, 65, 0.1);
            border-top-color: #00ff41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
        }
        
        p {
            font-size: 1.1rem;
            color: #b0b0b0;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            .loading-icon {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-icon"></div>
        <h1>در حال انتقال...</h1>
        <p>لطفاً صبر کنید</p>
    </div>
    
    <script>
        // This page will be handled by article-share.js
        // The JavaScript will detect /s/:slug and redirect to the full article
    </script>
</body>
</html>
